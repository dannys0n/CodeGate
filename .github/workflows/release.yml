name: Publish Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' must match package.json version '$expectedTag'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Restore pinned problem sources and catalog
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipDependencies

      - name: Validate application
        run: |
          npm run check
          npm test -- --run

      - name: Build Windows installer
        run: npm run desktop:build -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Create installer checksum
        id: artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist-desktop/CodeGate-Setup-*.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one CodeGate installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $checksum = Join-Path $installer.DirectoryName "$($installer.Name).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii -LiteralPath $checksum
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $tagMessage = @(git for-each-ref --format='%(contents)' "refs/tags/$tag") -join "`n"
          $messageParts = $tagMessage -split '\r?\n', 2
          $releaseNote = if ($messageParts.Count -gt 1) { $messageParts[1].Trim() } else { '' }
          $previousTag = "$(git describe --tags --abbrev=0 "$tag^" 2>$null)".Trim()
          $range = if ($previousTag) { "$previousTag..$tag" } else { $tag }
          $changes = @(git log --format='%H%x09%s' $range | ForEach-Object {
            $parts = $_ -split "`t", 2
            if ($parts.Count -eq 2 -and $parts[1] -notmatch '^Release v\d') {
              "- $($parts[1]) ($($parts[0].Substring(0, 7)))"
            }
          })
          $sections = @()
          if ($releaseNote) { $sections += $releaseNote }
          if ($changes.Count) { $sections += "## Changes`n`n$($changes -join "`n")" }
          if ($previousTag) {
            $sections += "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$previousTag...$tag"
          }
          if (-not $sections.Count) { $sections += 'No release notes were provided.' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, ($sections -join "`n`n") + "`n", [Text.UTF8Encoding]::new($false))
          $arguments = @(
            'release', 'create', $tag,
            '${{ steps.artifact.outputs.installer }}',
            '${{ steps.artifact.outputs.checksum }}',
            '--verify-tag',
            '--notes-file', $notesFile,
            '--title', "CodeGate $tag"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
