<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CodeGate workflow visual placeholder</title>
  <desc id="desc">Four steps connect challenge selection, editing, judging, and unlocking.</desc>
  <rect width="1200" height="360" rx="24" fill="#0f172a"/>
  <text x="600" y="54" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle">From challenge to unlock</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g transform="translate(65 105)">
      <rect width="235" height="150" rx="18" fill="#172554" stroke="#6366f1" stroke-width="2"/>
      <circle cx="117.5" cy="49" r="25" fill="#4f46e5"/>
      <text x="117.5" y="57" fill="#fff" font-size="22" font-weight="700">1</text>
      <text x="117.5" y="100" fill="#e0e7ff" font-size="19" font-weight="700">Select</text>
      <text x="117.5" y="126" fill="#a5b4fc" font-size="14">Problem + language</text>
    </g>
    <g transform="translate(345 105)">
      <rect width="235" height="150" rx="18" fill="#164e63" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="117.5" cy="49" r="25" fill="#0891b2"/>
      <text x="117.5" y="57" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="117.5" y="100" fill="#cffafe" font-size="19" font-weight="700">Code</text>
      <text x="117.5" y="126" fill="#a5f3fc" font-size="14">Complete the solution</text>
    </g>
    <g transform="translate(625 105)">
      <rect width="235" height="150" rx="18" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
      <circle cx="117.5" cy="49" r="25" fill="#9333ea"/>
      <text x="117.5" y="57" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="117.5" y="100" fill="#f3e8ff" font-size="19" font-weight="700">Judge</text>
      <text x="117.5" y="126" fill="#d8b4fe" font-size="14">Run official tests</text>
    </g>
    <g transform="translate(905 105)">
      <rect width="235" height="150" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <circle cx="117.5" cy="49" r="25" fill="#16a34a"/>
      <text x="117.5" y="57" fill="#fff" font-size="22" font-weight="700">4</text>
      <text x="117.5" y="100" fill="#dcfce7" font-size="19" font-weight="700">Unlock</text>
      <text x="117.5" y="126" fill="#bbf7d0" font-size="14">Return to Windows</text>
    </g>
  </g>
  <g fill="#64748b">
    <path d="M310 174h25l-9-9 7-7 21 21-21 21-7-7 9-9h-25z"/>
    <path d="M590 174h25l-9-9 7-7 21 21-21 21-7-7 9-9h-25z"/>
    <path d="M870 174h25l-9-9 7-7 21 21-21 21-7-7 9-9h-25z"/>
  </g>
  <text x="600" y="318" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">Replace this diagram with a product recording when the public demo is ready.</text>
</svg>
