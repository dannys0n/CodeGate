<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CodeGate desktop demo placeholder</title>
  <desc id="desc">A stylized dark CodeGate editor with a note that a demo GIF is coming soon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect x="48" y="48" width="1104" height="579" rx="18" fill="#0a0f1a" stroke="#334155" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="54" rx="18" fill="#111827"/>
  <circle cx="81" cy="75" r="7" fill="#fb7185"/>
  <circle cx="105" cy="75" r="7" fill="#fbbf24"/>
  <circle cx="129" cy="75" r="7" fill="#4ade80"/>
  <text x="600" y="82" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">CodeGate</text>
  <rect x="72" y="126" width="314" height="473" rx="12" fill="#111827"/>
  <text x="98" y="168" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Two Sum</text>
  <rect x="98" y="191" width="58" height="24" rx="12" fill="#312e81"/>
  <text x="127" y="208" fill="#c4b5fd" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">99%</text>
  <rect x="166" y="191" width="76" height="24" rx="12" fill="#164e63"/>
  <text x="204" y="208" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Python</text>
  <text x="98" y="258" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">Return the indices of two numbers</text>
  <text x="98" y="282" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">whose values add up to the target.</text>
  <rect x="98" y="522" width="154" height="44" rx="9" fill="url(#accent)"/>
  <text x="175" y="550" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Run official tests</text>
  <rect x="410" y="126" width="718" height="473" rx="12" fill="#0d1117"/>
  <text x="440" y="166" fill="#64748b" font-family="Consolas, monospace" font-size="16">1</text>
  <text x="476" y="166" fill="#c084fc" font-family="Consolas, monospace" font-size="16">class</text>
  <text x="530" y="166" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">Solution:</text>
  <text x="440" y="200" fill="#64748b" font-family="Consolas, monospace" font-size="16">2</text>
  <text x="476" y="200" fill="#c084fc" font-family="Consolas, monospace" font-size="16">    def</text>
  <text x="548" y="200" fill="#67e8f9" font-family="Consolas, monospace" font-size="16">twoSum</text>
  <text x="612" y="200" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">(self, nums, target):</text>
  <text x="440" y="234" fill="#64748b" font-family="Consolas, monospace" font-size="16">3</text>
  <text x="476" y="234" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">        seen = {}</text>
  <text x="440" y="268" fill="#64748b" font-family="Consolas, monospace" font-size="16">4</text>
  <text x="476" y="268" fill="#c084fc" font-family="Consolas, monospace" font-size="16">        for</text>
  <text x="524" y="268" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">i, value in enumerate(nums):</text>
  <rect x="470" y="290" width="550" height="38" rx="6" fill="#312e81" opacity="0.72"/>
  <text x="486" y="315" fill="#ddd6fe" font-family="Consolas, monospace" font-size="15"># Hint: look up the complement before saving this value</text>
  <text x="440" y="362" fill="#64748b" font-family="Consolas, monospace" font-size="16">6</text>
  <text x="476" y="362" fill="#e2e8f0" font-family="Consolas, monospace" font-size="16">            seen[value] = i</text>
  <rect x="692" y="490" width="348" height="62" rx="31" fill="#111827" stroke="#475569"/>
  <circle cx="729" cy="521" r="17" fill="url(#accent)"/>
  <path d="M723 512l15 9-15 9z" fill="#fff"/>
  <text x="762" y="527" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="18">Demo GIF coming soon</text>
</svg>
