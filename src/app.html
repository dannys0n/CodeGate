<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				try {
					var desktop = window.codegateDesktop && window.codegateDesktop.settingsSnapshot;
					var raw = desktop && desktop.desktopSettingsPresent !== false
						? null
						: localStorage.getItem('user-settings');
					var parsed = raw ? JSON.parse(raw) : null;
					var theme = desktop && desktop.desktopSettingsPresent !== false
						? desktop.theme
						: parsed && parsed.theme;
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.dataset.theme = theme;
					}
				} catch (err) {
					console.warn(err);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
